<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./content.js"></script>
<script>
"use strict";
(function(){
const data=window.EQ_DATA;
let AUDIO={};
let currentAudio=null;
function audioButton(id) {
  if(!AUDIO[id]) return "";
  return '<button class="btn small-btn" data-action="audio" data-audio="'+esc(id)+'">▶ 発音を聞く</button>';
}
function playAudio(id) {
  const src=AUDIO[id];
  if(!src)return;
  if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}}
  const audio=new Audio(src);
  currentAudio=audio;
  audio.preload="auto";
  function failed(){
    if(currentAudio!==audio)return;
    delete AUDIO[id];
    render();
    toast("音声を再生できなかったため、このボタンを非表示にしました。");
  }
  audio.onerror=failed;
  try {
    const promise=audio.play();
    if(promise && typeof promise.catch==="function")promise.catch(failed);
  }catch(e){failed();}
}
function loadAudio(){
  fetch("./audio-map.json",{cache:"no-store"})
   .then(r=>r.ok?r.json():null)
   .then(x=>{
      if(!x||!x.files||typeof x.files!=="object")return;
      const valid={};
      for(const [id,url] of Object.entries(x.files)){
         if(typeof url==="string" && /^\.\/audio\/[a-z0-9_\/-]+\.mp3$/.test(url))valid[id]=url;
      }
      AUDIO=valid;
      render();
   }).catch(()=>{});
}
const root=document.getElementById("root");
if(!data){root.textContent="学習データを読み込めませんでした。content.js が必要です。";return;}
const LEVELS=["A2","B1","B2","C1"];
const levelJP={A2:"日常を伝える",B1:"意見を話す",B2:"議論を深める",C1:"精密に表現する"};
const ALL=data.units.flatMap(function(u){return u.questions;}).concat(data.readings.flatMap(function(r){return r.questions;}));
const QMAP=Object.fromEntries(ALL.map(function(q){return [q.id,q];}));
const UMAP=Object.fromEntries(data.units.map(function(u){return [u.id,u];}));
const RMAP=Object.fromEntries(data.readings.map(function(r){return [r.id,r];}));
const KEY="EnglishQuest_A2_C1_v1";
const defaults={version:1,attempts:{},history:[],xp:0,streak:0,lastDay:"",spoken:{},drafts:{},lastLevel:"A2"};
let state=load();
let page="home",selectedLevel=state.lastLevel||"A2",mode="mixed",length=10,activeUnit=null,quiz=null,selectedSpeech=0,selectedWriting=0,modelVisible=false,transcript="",recognition=null;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function shuffle(xs){const x=xs.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&typeof x==="object"&&!Array.isArray(x)){return Object.assign({},defaults,x,{attempts:x.attempts||{},history:Array.isArray(x.history)?x.history:[],spoken:x.spoken||{},drafts:x.drafts||{}});}}catch(e){}return JSON.parse(JSON.stringify(defaults));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("保存領域の空き容量を確認してください。");}}
function today(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}catch(e){return new Date().toISOString().slice(0,10);}}
function dayNum(s){let p=s.split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])/86400000;}
function touchDay(){const d=today();if(state.lastDay!==d){state.streak=state.lastDay&&dayNum(d)-dayNum(state.lastDay)===1?state.streak+1:1;state.lastDay=d;}}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(function(){x.classList.remove("show");},2400);}
function attempt(id){return state.attempts[id]||{hits:0,tries:0,correct:0,due:0,last:0};}
function mastered(id){return attempt(id).hits>=2;}
function byLevel(level){return ALL.filter(function(q){return level==="ALL"||q.level===level;});}
function stats(xs){let done=xs.filter(function(q){return mastered(q.id);}).length;let trials=xs.reduce(function(t,q){return t+attempt(q.id).tries;},0);let wins=xs.reduce(function(t,q){return t+attempt(q.id).correct;},0);return {done,total:xs.length,tries:trials,rate:trials?Math.round(wins/trials*100):0,pct:xs.length?Math.round(done/xs.length*100):0};}
function dueList(level){const now=Date.now();return byLevel(level).filter(function(q){let a=attempt(q.id);return a.tries>0&&a.due<=now;});}
function percent(x){return clamp(x,0,100)+"%";}
function prog(value){return '<div class="bar"><div class="fill" style="width:'+percent(value)+'"></div></div>';}
function nav(name,label,ico){return '<button class="'+(page===name?"active":"")+'" data-action="nav" data-page="'+name+'"><span class="navico">'+ico+'</span>'+label+'</button>';}
function shell(content){root.innerHTML='<header class="top"><div class="wrap top-inner"><div class="identity" data-action="nav" data-page="home" role="button" tabindex="0"><div class="logo">E</div><div class="wordmark">English <span>Quest</span></div></div><nav class="topnav" aria-label="メインメニュー">'+nav("home","ホーム","⌂")+nav("learn","レッスン","▤")+nav("practice","4択演習","◉")+nav("speak","話す・書く","◌")+nav("stats","学習記録","▥")+'</nav><div class="top-side">A2 → C1 · Offline-friendly</div></div></header><main class="wrap main">'+content+'<footer class="footer">English Quest · A2 to C1 · 端末内に学習記録を保存 · CEFR学習補助教材</footer></main><nav class="mobile-nav" aria-label="モバイルメニュー">'+nav("home","ホーム","⌂")+nav("learn","学習","▤")+nav("practice","4択","◉")+nav("speak","発話","◌")+nav("stats","記録","▥")+'</nav>';}
function levelFilter(includeAll){let arr=includeAll?["ALL"].concat(LEVELS):LEVELS;return '<div class="controls" role="group" aria-label="学習レベル">'+arr.map(function(l){return '<button class="seg '+(selectedLevel===l?"active":"")+'" data-action="level" data-level="'+l+'">'+(l==="ALL"?"すべて":l)+'</button>';}).join("")+'</div>';}
function renderHome(){page="home";let s=stats(ALL),due=dueList("ALL").length;let x='<section class="hero panel"><div><div class="eyebrow">A2 → B1 → B2 → C1</div><h1>Understand it.<br>Use it. <span style="color:var(--blue)">Own it.</span></h1><p>暗記だけで終わらせない。文法・語彙・読解を4択で鍛え、スピーキングと作文で実際に使う。毎日少しずつ、正確な英語へ。</p><div class="hero-cta"><button class="btn primary" data-action="start" data-mode="mixed">今日の10問を始める →</button><button class="btn" data-action="nav" data-page="learn">コースを見る</button></div></div><div class="hero-progress"><div class="tiny muted">全体の習得状況</div><div class="progress-head"><div class="big-num mono">'+s.done+'<span style="font-size:16px;color:#8b96a7;font-weight:600"> / '+s.total+'</span></div><span class="pill">'+s.pct+'%</span></div>'+prog(s.pct)+'<div class="tiny muted">異なる問題をそれぞれ2回正解すると習得。似た形式でも別の英文は別カウント。</div></div></section>';
 x+='<section class="metric-grid"><div class="metric panel"><strong class="mono">'+state.xp+'</strong><span>XP</span></div><div class="metric panel"><strong class="mono">'+s.rate+'%</strong><span>正答率</span></div><div class="metric panel"><strong class="mono">'+due+'</strong><span>復習対象</span></div><div class="metric panel"><strong class="mono">'+(state.lastDay&&dayNum(today())-dayNum(state.lastDay)<=1?state.streak:0)+'</strong><span>連続学習日数</span></div></section>';

function answer(i){if(!quiz||quiz.answered!==null)return;let q=QMAP[quiz.items[quiz.index]],o=quiz.orders[q.id][i];if(o===undefined)return;let ok=o===q.correct;quiz.answered=o;quiz.correct+=ok?1:0;if(!ok)quiz.wrong.push(q.id);let a=attempt(q.id);a.tries++;a.correct+=ok?1:0;a.hits=ok?Math.min(2,a.hits+1):0;a.last=Date.now();a.due=Date.now()+(ok?(a.hits>=2?72:24)*3600000:0);state.attempts[q.id]=a;state.xp+=ok?10:2;state.history.push({id:q.id,correct:ok,at:a.last});if(state.history.length>500)state.history=state.history.slice(-500);touchDay();save();renderQuiz();}

 if(a==="length"){length=Number(b.dataset.length);renderPractice();return;}
 if(a==="start"){createQuiz(b.dataset.mode||mode,b.dataset.scope||null);window.scrollTo(0,0);return;}
 if(a==="start-unit"){createQuiz("mixed",b.dataset.id);window.scrollTo(0,0);return;}
 if(a==="reading"){createQuiz("reading",b.dataset.id);window.scrollTo(0,0);return;}
 if(a==="choice"){answer(Number(b.dataset.idx));return;}
 if(a==="next"){next();window.scrollTo(0,0);return;}
 if(a==="audio"){playAudio(b.dataset.audio);return;}
 if(a==="speech-next"){let list=data.speaking.filter(function(q){return q.level===selectedLevel;});selectedSpeech=(selectedSpeech+1)%list.length;modelVisible=false;transcript="";renderSpeak();return;}
 if(a==="speech-select"){selectedSpeech=Number(b.dataset.idx);modelVisible=false;transcript="";renderSpeak();return;}
 if(a==="model"){modelVisible=!modelVisible;renderSpeak();return;}
 if(a==="record"){speakRecord();return;}
 if(a==="spoke"){let list=data.speaking.filter(function(q){return q.level===selectedLevel;}),s=list[selectedSpeech];state.spoken[s.id]=(state.spoken[s.id]||0)+1;state.xp+=5;touchDay();save();toast("発話練習を記録しました。");renderSpeak();return;}
 if(a==="writing-select"){selectedWriting=Number(b.dataset.idx);renderSpeak();return;}
 if(a==="export"){exportSave();return;}
 if(a==="import"){document.getElementById("importFile").click();return;}
 if(a==="reset"){if(confirm("English Quest のすべての学習記録を消去しますか？")){state=JSON.parse(JSON.stringify(defaults));save();renderStats();toast("記録を初期化しました。");}return;}
});
document.addEventListener("input",function(e){let el=e.target;if(el&&el.id==="writingArea"){state.drafts[el.dataset.id]=el.value;save();}});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="importFile")importSave(e.target.files&&e.target.files[0]);});
document.addEventListener("keydown",function(e){if(e.target.matches("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;if(page==="quiz"&&quiz&&quiz.answered===null&&/^[1-4]$/.test(e.key))answer(Number(e.key)-1);if(e.key==="Enter"&&e.target.classList.contains("identity"))navigate("home");});
renderHome();
loadAudio();
})();
