<script>
const STORE='DeutschQuest_iPhone_v3';
const LEGACY_STORES=['DeutschNexus_FR_DE_v2'];
const DEFAULT_STATE={version:3,xp:0,combo:0,bestCombo:0,answered:0,correct:0,mastery:{},errors:{},seen:{},lessonDone:{},tests:[],recentMistakes:[],achievements:[],lastFamily:null,updatedAt:0,sound:true};
let state=loadState();
function loadState(){try{let raw=localStorage.getItem(STORE);if(!raw){for(const k of LEGACY_STORES){raw=localStorage.getItem(k);if(raw)break}}if(raw){const x=JSON.parse(raw);return Object.assign({},DEFAULT_STATE,x,{version:3,mastery:x.mastery||{},errors:x.errors||{},seen:x.seen||{},lessonDone:x.lessonDone||{},tests:x.tests||[],recentMistakes:x.recentMistakes||[],achievements:x.achievements||[]})}}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_STATE))}
function save(){state.updatedAt=Date.now();try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){} }
function manualSave(){save();showToast('Sauvegarde locale effectuée')}
function resetAll(){if(!confirm('Effacer toute la progression Deutsch Quest ?'))return;state=JSON.parse(JSON.stringify(DEFAULT_STATE));save();renderHome()}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function beep(ok){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?720:230;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09)}catch(e){}}
function toggleSound(){state.sound=!state.sound;save();showToast(state.sound?'Son activé':'Son désactivé');renderHome()}
function rand(n){return Math.floor(Math.random()*n)} function pick(a){return a[rand(a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniq(a){return [...new Set(a)]}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escapeAttr(s){return escapeHtml(s).replace(/'/g,'&#39;')}
function norm(s){return String(s).normalize('NFC').trim().toLowerCase().replace(/[„“”]/g,'"').replace(/[’‘]/g,"'").replace(/\s+([,;:.!?])/g,'$1').replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim()}
function foldKeyboard(s){return norm(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[,;:]/g,'').replace(/\s+/g,' ').trim()}
function gernFold(s){return foldKeyboard(s).replace(/\bgerne\b/g,'gern')}
function coordinationVariant(s){const x=norm(s).replace(/[,;:]/g,'');const m=x.match(/^(.*?)([a-zäöüß-]+)\s+und\s+([a-zäöüß-]+)(.*)$/i);if(!m)return null;return `${m[1]}${m[3]} und ${m[2]}${m[4]}`}
function gradeAnswer(expected,actual,opts={}){
  const e=norm(expected),a=norm(actual);
  if(e===a)return {ok:true,kind:'exact'};
  if(foldKeyboard(e)===foldKeyboard(a))return {ok:true,kind:'keyboard'};
  if(gernFold(e)===gernFold(a))return {ok:true,kind:'variant'};
  if(opts.accept&&opts.accept.some(x=>gernFold(x)===gernFold(a)))return {ok:true,kind:'variant'};
  if(opts.flex==='coordination'||opts.flex==='input'){
    const v=coordinationVariant(e);
    if(v&&gernFold(v)===gernFold(a))return {ok:true,kind:'coordination'};
  }
  return {ok:false,kind:'wrong'};
}
function choices(correct,pool){const w=shuffle(uniq(pool.filter(x=>norm(x)!==norm(correct))));return shuffle([correct,...w.slice(0,3)])}
function mcq(familyId,module,prompt,main,answer,wrong,explain){return {familyId,module,type:'mcq',prompt,main,answer,choices:choices(answer,wrong),explain}}
function orderQ(familyId,module,prompt,answer,explain,options={}){return {familyId,module,type:'order',prompt,main:'Remets les éléments dans le bon ordre.',answer,choices:answer.replace(/[.!?]$/,'').split(' '),explain,...options}}
function inputQ(familyId,module,prompt,main,answer,accept,explain,options={}){return {familyId,module,type:'input',prompt,main,answer,accept:accept||[answer],explain,flex:'input',...options}}

const app=document.getElementById('app'); let mode='home',moduleFilter=null,current=null,locked=false,tokenBuilt=[],testSession=null;
function famsForModule(id){return FAMILIES.filter(f=>f.module===id)}
function mastery(fid){return state.mastery[fid]||0}
function totalMasteryPoints(){return Object.values(state.mastery).reduce((a,b)=>a+b,0)}
function moduleProgress(id){const fs=famsForModule(id);if(!fs.length)return 100;return Math.round(fs.reduce((s,f)=>s+mastery(f.id),0)/(fs.length*5)*100)}
function totalMasteredFamilies(){return FAMILIES.filter(f=>mastery(f.id)>=5).length}
function accuracy(){return state.answered?Math.round(state.correct/state.answered*100):0}
function cefr(){const p=totalMasteryPoints()/(FAMILIES.length*5);if(p>.82&&accuracy()>=82)return {name:'B1-',sub:'B1 en construction',rank:'GATE OPEN',pct:88};if(p>.48)return {name:'A2+',sub:'transition vers B1',rank:'AUFBAU',pct:68};return {name:'A2',sub:'base active',rank:'FOUNDATION',pct:46}}
function weakModules(){return MODULES.filter(m=>m.id!=='boss').map(m=>{const fs=famsForModule(m.id),err=fs.reduce((s,f)=>s+(state.errors[f.id]||0),0);return {...m,err,progress:moduleProgress(m.id)}}).sort((a,b)=>(b.err+(100-b.progress)/20)-(a.err+(100-a.progress)/20))}
function setNavActive(key){document.querySelectorAll('#mobileNav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+key)?.classList.add('active')}
function smartHint(){return `<div class="smartHint">Correction intelligente : variantes valides acceptées</div>`}
function renderTop(){return `<div class="topline"><div class="brand"><div class="mark"></div><div><div class="brandKicker">Français ⇄ Deutsch</div><div class="brandTitle">Deutsch Quest</div></div></div><div class="iconRow"><button class="iconBtn" onclick="toggleSound()">${state.sound?'♪':'×♪'}</button><button class="iconBtn" onclick="renderSave()">SAVE</button></div></div>`}
function renderHome(){setNavActive('home');mode='home';current=null;locked=false;const lv=cefr(),weak=weakModules()[0];app.innerHTML=renderTop()+`<div class="hero"><div class="heroGrid"><div><div class="eyebrow">PERSONAL GERMAN SYSTEM</div><h1>Deutsch.<br>Aber richtig.</h1><p>Leçons courtes, exercices générés, tests, révision des erreurs et sauvegarde locale. Les mêmes structures reviennent, mais les phrases changent : tu apprends la règle, pas la capture d’écran.</p></div><div class="levelCard"><div class="levelTop"><div><div class="cefr">${lv.name}</div><div class="cefrSub">${lv.sub}</div></div><div class="rank">${lv.rank}</div></div><div class="progress"><div style="width:${lv.pct}%"></div></div><div class="tiny">Objectif actuel : A2+ solide puis B1. Priorité : ordre des mots, cas, connecteurs et expression structurée.</div></div></div></div><div class="installNote">Pour l’utiliser comme une vraie app : ouvre cette Web App depuis Safari via une adresse HTTPS, puis Partager → Ajouter à l’écran d’accueil. La progression reste enregistrée sur l’iPhone.</div>
<div class="stats"><div class="stat"><div class="statN">${state.xp}</div><div class="statL">XP</div></div><div class="stat"><div class="statN">${accuracy()}%</div><div class="statL">Précision</div></div><div class="stat"><div class="statN">${totalMasteredFamilies()}/${FAMILIES.length}</div><div class="statL">Familles maîtrisées</div></div><div class="stat"><div class="statN">${Object.values(state.errors).reduce((a,b)=>a+b,0)}</div><div class="statL">Erreurs à revoir</div></div><div class="stat"><div class="statN">${state.bestCombo}</div><div class="statL">Beste Serie</div></div></div>
<div class="sectionHead"><div class="sectionTitle">Centre d’entraînement</div><div class="sectionMeta">5 modes, une seule progression</div></div>
<div class="mainGrid"><button class="action primaryAction" onclick="renderLessons()"><div class="actionTag">01 · Comprendre</div><div class="actionTitle">Leçons</div><div class="actionDesc">Règles, exemples et points pièges avant de pratiquer.</div><div class="actionIcon">L</div></button><button class="action" onclick="renderPractice()"><div class="actionTag">02 · Répéter</div><div class="actionTitle">Banque d’exercices</div><div class="actionDesc">Exercices illimités générés par famille. Même règle, phrases différentes.</div><div class="actionIcon">∞</div></button><button class="action" onclick="renderTestMenu()"><div class="actionTag">03 · Mesurer</div><div class="actionTitle">Test</div><div class="actionDesc">10, 20 ou 30 questions. Résultat global et par domaine.</div><div class="actionIcon">%</div></button><button class="action" onclick="renderMistakes()"><div class="actionTag">04 · Corriger</div><div class="actionTitle">Mes erreurs</div><div class="actionDesc">Retravaille les familles ratées avec de nouvelles phrases.</div><div class="actionIcon">↺</div></button><button class="action" onclick="renderSave()"><div class="actionTag">05 · Conserver</div><div class="actionTitle">Sauvegarde</div><div class="actionDesc">Auto-save local + export/import de ta progression.</div><div class="actionIcon">▣</div></button></div>
<div class="sectionHead"><div class="sectionTitle">Missionskarte</div><div class="sectionMeta">Point faible actuel : ${weak.title}</div></div><div class="missions">${MODULES.map((m,i)=>{const p=moduleProgress(m.id);const lock=m.id==='boss'&&totalMasteredFamilies()<12;return `<button class="mission" onclick="${lock?`showToast('B1 Gate : maîtrise 12 familles avant')`:`startPractice('${m.id}')`}"><div class="missionTop"><div class="missionIndex">${String(i+1).padStart(2,'0')} / ${m.icon}</div><div class="missionStatus">${lock?'GESPERRT':p===100?'GEMEISTERT':p+'%'}</div></div><div class="missionTitle">${m.title}</div><div class="missionDesc">${m.desc}</div><div class="missionFoot"><div class="miniBar"><div style="width:${p}%"></div></div><div class="percent">${p}%</div></div></button>`}).join('')}</div><div class="footer">DEUTSCH QUEST · iPHONE · HORS LIGNE · AUTO-SAVE</div>`}

function renderLessons(){setNavActive('lessons');app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">LEÇONS</div></div><div class="panel"><div class="eyebrow">LEARN BEFORE GRIND</div><h2 style="font-size:34px;margin:8px 0 4px">Leçons ciblées</h2><div class="tiny">Chaque chapitre correspond directement aux familles d’exercices.</div><div class="lessonGrid" style="margin-top:16px">${MODULES.map(m=>`<button class="lessonCard" onclick="renderLesson('${m.id}')"><div class="missionTop"><div class="missionIndex">${m.icon}</div><div class="lessonDone">${state.lessonDone[m.id]?'ÉTUDIÉE':'À VOIR'}</div></div><div class="missionTitle">${m.title}</div><div class="missionDesc">${LESSONS[m.id].intro}</div></button>`).join('')}</div></div>`}
function renderLesson(id){const m=MODULES.find(x=>x.id===id),l=LESSONS[id];app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderLessons()">‹ LEÇONS</button><div class="modeBadge">${m.title}</div></div><div class="panel"><div class="eyebrow">${m.icon} · LEÇON</div><h2 style="font-size:34px;margin:8px 0 6px">${m.title}</h2><div class="context">${l.intro}</div><div class="lessonContent"><div class="lessonBox"><h3>À retenir</h3><ul>${l.points.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="lessonBox"><h3>Exemples</h3>${l.examples.map(e=>`<div class="example"><div class="exampleDE">${e[0]}</div><div class="exampleFR">${e[1]}</div></div>`).join('')}</div></div><button class="nextBtn" onclick="completeLesson('${id}')">MARQUER COMME ÉTUDIÉE + S’ENTRAÎNER</button><button class="secondaryBtn" onclick="startPractice('${id}')">S’ENTRAÎNER DIRECTEMENT</button></div>`}
function completeLesson(id){state.lessonDone[id]=true;state.xp+=15;save();showToast('Leçon enregistrée +15 XP');startPractice(id)}

function renderPractice(){setNavActive('practice');app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">BANQUE D’EXERCICES</div></div><div class="panel"><div class="eyebrow">UNLIMITED VARIANTS</div><h2 style="font-size:34px;margin:8px 0 4px">Même règle. Nouvelle phrase.</h2><div class="tiny">Chaque clic génère une nouvelle variante : tu apprends la structure, pas l’ordre mémorisé des réponses.</div><button class="nextBtn" onclick="startPractice(null)">MIX ILLIMITÉ</button><div class="missions" style="margin-top:14px">${MODULES.map(m=>`<button class="mission" onclick="startPractice('${m.id}')"><div class="missionTop"><div class="missionIndex">${m.icon}</div><div class="missionStatus">${famsForModule(m.id).length} FAMILLES</div></div><div class="missionTitle">${m.title}</div><div class="missionDesc">Progression ${moduleProgress(m.id)} % · variantes générées à chaque passage.</div></button>`).join('')}</div></div>`}
function weightedFamily(pool){let w=[];pool.forEach(f=>{let n=2+(5-mastery(f.id))+(state.errors[f.id]||0)*2;if(f.id===state.lastFamily)n=Math.max(1,n-4);for(let i=0;i<n;i++)w.push(f)});return pick(w)}
function startPractice(id){setNavActive('practice');mode='practice';moduleFilter=id;testSession=null;nextQuestion()}
function startMistakeMode(){const bad=FAMILIES.filter(f=>(state.errors[f.id]||0)>0);if(!bad.length){showToast('Aucune erreur active');return}mode='mistakes';moduleFilter=null;testSession=null;nextQuestion()}
function nextQuestion(){locked=false;tokenBuilt=[];let pool;if(mode==='mistakes'){pool=FAMILIES.filter(f=>(state.errors[f.id]||0)>0)}else if(mode==='test'){return nextTestQuestion()}else{pool=FAMILIES.filter(f=>!moduleFilter||f.module===moduleFilter);if(moduleFilter==='boss'&&totalMasteredFamilies()<12){showToast('B1 Gate verrouillé');renderHome();return}}if(!pool.length){renderHome();return}const fam=weightedFamily(pool);current=fam.generate();current.family=fam;state.lastFamily=fam.id;state.seen[fam.id]=(state.seen[fam.id]||0)+1;save();renderQuestion()}
function renderQuestion(){const m=MODULES.find(x=>x.id===current.module),p=moduleProgress(current.module);app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">${mode==='mistakes'?'RÉVISION DES ERREURS':mode==='test'?`TEST ${testSession.index+1}/${testSession.total}`:m.title}</div></div><div class="panel"><div class="questHeader"><div><div class="questName">${m.title}</div><div class="questSub">${current.family.level} · ${current.family.label} · maîtrise ${mastery(current.familyId)}/5</div></div><div class="combo">COMBO ×${state.combo}</div></div><div class="progress"><div style="width:${mode==='test'?Math.round(testSession.index/testSession.total*100):p}%"></div></div><div class="questionCard"><div class="questionPrompt">${current.prompt}</div><div class="questionMain">${escapeHtml(current.main)}</div>${(current.type==='input'||current.flex)?smartHint():''}<div id="answerArea"></div><div id="feedback"></div></div></div>`;renderAnswerArea()}
function renderAnswerArea(){const a=document.getElementById('answerArea');if(current.type==='mcq'){a.innerHTML=`<div class="options">${current.choices.map(c=>`<button class="option" data-v="${escapeAttr(c)}" onclick="answerMCQ(this)">${escapeHtml(c)}</button>`).join('')}</div>`}else if(current.type==='order'){const tok=shuffle(current.choices.map((t,i)=>({t,i})));a.innerHTML=`<div class="sentenceBox" id="sentenceBox"><span class="tiny">Clique les éléments dans le bon ordre</span></div><div class="tokenArea">${tok.map(x=>`<button class="token" id="tok${x.i}" onclick="useToken(${x.i},'${escapeAttr(x.t)}')">${escapeHtml(x.t)}</button>`).join('')}</div><button class="nextBtn" onclick="checkOrder()">SATZ PRÜFEN</button>`}else{a.innerHTML=`<div class="inputWrap"><input class="textInput" id="textInput" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="Écris en allemand…"><button class="submit" onclick="checkInput()">PRÜFEN</button></div>`;setTimeout(()=>document.getElementById('textInput')?.focus(),50)}}
function answerMCQ(btn){if(locked)return;const v=btn.dataset.v,ok=norm(v)===norm(current.answer);if(mode!=='test'){document.querySelectorAll('.option').forEach(b=>{b.classList.add('lock');if(norm(b.dataset.v)===norm(current.answer))b.classList.add('correct')});if(!ok)btn.classList.add('wrong')}finish(ok,v)}
function useToken(i,t){if(locked)return;const b=document.getElementById('tok'+i);if(!b||b.classList.contains('used'))return;b.classList.add('used');tokenBuilt.push({i,t});refreshSentence()}
function undoToken(k){if(locked)return;const x=tokenBuilt.splice(k,1)[0];document.getElementById('tok'+x.i)?.classList.remove('used');refreshSentence()}
function refreshSentence(){const box=document.getElementById('sentenceBox');box.innerHTML=tokenBuilt.length?tokenBuilt.map((x,k)=>`<button class="token" onclick="undoToken(${k})">${escapeHtml(x.t)}</button>`).join(''):'<span class="tiny">Clique les éléments dans le bon ordre</span>'}
function checkOrder(){if(locked)return;const ans=tokenBuilt.map(x=>x.t).join(' ').replace(/\s+([,.!?])/g,'$1');const g=gradeAnswer(current.answer,ans,{flex:current.flex});finish(g.ok,ans,g.kind)}
function checkInput(){if(locked)return;const v=document.getElementById('textInput').value;const g=gradeAnswer(current.answer,v,{accept:current.accept||[current.answer],flex:current.flex||'input'});finish(g.ok,v,g.kind)}
function finish(ok,userAnswer='',gradeKind='exact'){locked=true;state.answered++;if(ok){state.correct++;state.combo++;state.xp+=10+Math.min(25,state.combo*2);state.mastery[current.familyId]=Math.min(5,mastery(current.familyId)+1);if(mode==='mistakes'&&(state.errors[current.familyId]||0)>0)state.errors[current.familyId]--;beep(true)}else{state.combo=0;state.xp=Math.max(0,state.xp-2);state.mastery[current.familyId]=Math.max(0,mastery(current.familyId)-1);state.errors[current.familyId]=(state.errors[current.familyId]||0)+1;state.recentMistakes.unshift({time:Date.now(),familyId:current.familyId,module:current.module,main:current.main,answer:current.answer,user:userAnswer});state.recentMistakes=state.recentMistakes.slice(0,50);beep(false)}if(state.combo>state.bestCombo)state.bestCombo=state.combo;checkAchievements();save();if(mode==='test')return finishTestQuestion(ok,userAnswer);const f=document.getElementById('feedback');f.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="feedbackTitle">${ok?'RICHTIG':'NOCH NICHT'}</div><div class="feedbackBody">${ok&&gradeKind!=='exact'?`<span class="altValid">Variante valide acceptée.</span><br>`:''}${!ok?`Réponse correcte : <span class="explainKey">${escapeHtml(current.answer)}</span><br>`:''}${escapeHtml(current.explain)}${mode==='mistakes'&&ok?'<br><span class="explainKey">Erreur réduite : encore '+(state.errors[current.familyId]||0)+' à stabiliser.</span>':''}</div></div><button class="nextBtn" onclick="nextQuestion()">NÄCHSTE QUEST →</button>`;document.querySelectorAll('.token').forEach(x=>x.classList.add('lock'));if(document.getElementById('textInput'))document.getElementById('textInput').disabled=true}
function checkAchievements(){const add=(a)=>{if(!state.achievements.includes(a)){state.achievements.push(a);showToast('Erfolg : '+a)}};if(state.combo>=5)add('5er-Serie');if(state.combo>=10)add('10er-Serie');if(totalMasteredFamilies()>=10)add('10 Familien');if(totalMasteredFamilies()>=25)add('Strukturdenker');if(accuracy()>=85&&state.answered>=30)add('85% Präzision')}

function renderMistakes(){setNavActive('errors');const active=FAMILIES.filter(f=>(state.errors[f.id]||0)>0).sort((a,b)=>(state.errors[b.id]||0)-(state.errors[a.id]||0));app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">MES ERREURS</div></div><div class="panel"><div class="eyebrow">RECOVERY MODE</div><h2 style="font-size:34px;margin:8px 0 4px">Erreur ≠ condamnation à vie.</h2><div class="tiny">Une mauvaise réponse ajoute du poids à la famille concernée. En mode erreurs, chaque réussite retire progressivement ce poids, avec une nouvelle phrase à chaque fois.</div>${active.length?`<button class="nextBtn" onclick="startMistakeMode()">TRAVAILLER MES ${active.reduce((s,f)=>s+(state.errors[f.id]||0),0)} ERREURS</button><div class="weakGrid" style="margin-top:14px">${active.map(f=>`<div class="weakItem"><div class="weakName">${f.label}</div><div class="weakMeta">${MODULES.find(m=>m.id===f.module).title} · maîtrise ${mastery(f.id)}/5</div><div class="weakScore">×${state.errors[f.id]}</div></div>`).join('')}</div>`:`<div class="feedback good"><div class="feedbackTitle">Keine aktiven Fehler</div><div class="feedbackBody">Aucune famille n’a actuellement d’erreur enregistrée.</div></div>`}</div>`}

function renderTestMenu(){setNavActive('test');app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">TEST</div></div><div class="panel"><div class="eyebrow">STRICT MODE</div><h2 style="font-size:34px;margin:8px 0 4px">Test sans correction immédiate</h2><div class="tiny">Les réponses correctes ne sont révélées qu’à la fin. Le test mélange les domaines A2/A2+ et ajoute le B1 Gate s’il est débloqué.</div><div class="testChooser"><button class="testChoice" onclick="startTest(10)"><strong>10</strong><span class="tiny">test rapide</span></button><button class="testChoice" onclick="startTest(20)"><strong>20</strong><span class="tiny">test standard</span></button><button class="testChoice" onclick="startTest(30)"><strong>30</strong><span class="tiny">test complet</span></button></div></div>`}
function startTest(n){setNavActive('test');mode='test';moduleFilter=null;const pool=FAMILIES.filter(f=>f.module!=='boss'||totalMasteredFamilies()>=12);testSession={total:n,index:0,score:0,log:[],familyQueue:shuffle(pool.slice())};nextTestQuestion()}
function nextTestQuestion(){if(testSession.index>=testSession.total)return renderTestResults();locked=false;tokenBuilt=[];if(!testSession.familyQueue.length)testSession.familyQueue=shuffle(FAMILIES.filter(f=>f.module!=='boss'||totalMasteredFamilies()>=12));const fam=testSession.familyQueue.pop();current=fam.generate();current.family=fam;state.seen[fam.id]=(state.seen[fam.id]||0)+1;renderQuestion()}
function finishTestQuestion(ok,userAnswer){testSession.log.push({ok,module:current.module,family:current.family.label,main:current.main,answer:current.answer,user:userAnswer});if(ok)testSession.score++;testSession.index++;save();const f=document.getElementById('feedback');f.innerHTML=`<div class="feedback"><div class="feedbackTitle">Réponse enregistrée</div><div class="feedbackBody">Correction masquée jusqu’à la fin du test.</div></div><button class="nextBtn" onclick="nextQuestion()">${testSession.index>=testSession.total?'VOIR LE RÉSULTAT':'QUESTION SUIVANTE →'}</button>`}
function renderTestResults(){const pct=Math.round(testSession.score/testSession.total*100),mods={};testSession.log.forEach(x=>{mods[x.module]??={c:0,n:0};mods[x.module].n++;if(x.ok)mods[x.module].c++});const record={date:Date.now(),score:testSession.score,total:testSession.total,pct,modules:Object.fromEntries(Object.entries(mods).map(([k,v])=>[k,Math.round(v.c/v.n*100)]))};state.tests.unshift(record);state.tests=state.tests.slice(0,12);save();const wrong=testSession.log.filter(x=>!x.ok);app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">RÉSULTAT</div></div><div class="panel"><div class="eyebrow">TEST COMPLETE</div><h2 style="font-size:48px;margin:8px 0 2px">${pct}%</h2><div class="tiny">${testSession.score}/${testSession.total} bonnes réponses</div><div class="testResultGrid">${Object.entries(mods).map(([id,v])=>`<div class="resultBox"><div class="resultN">${Math.round(v.c/v.n*100)}%</div><div class="tiny">${MODULES.find(m=>m.id===id).title}</div></div>`).join('')}</div>${wrong.length?`<div class="sectionHead"><div class="sectionTitle">À revoir</div><div class="sectionMeta">${wrong.length} erreurs</div></div>${wrong.map(x=>`<div class="mistakeRow"><div class="mistakeQ">${escapeHtml(x.main)}</div><div class="mistakeA">✓ ${escapeHtml(x.answer)}</div><div class="mistakeYou">Ta réponse : ${escapeHtml(x.user||'—')}</div></div>`).join('')}`:'<div class="feedback good"><div class="feedbackTitle">Perfekt.</div><div class="feedbackBody">Aucune erreur sur ce test.</div></div>'}<button class="nextBtn" onclick="renderMistakes()">REVOIR MES ERREURS</button></div>`}

function renderSave(){const last=state.updatedAt?new Date(state.updatedAt).toLocaleString('fr-FR'):'jamais';app.innerHTML=renderTop()+`<div class="nav"><button class="back" onclick="renderHome()">‹ ACCUEIL</button><div class="modeBadge">SAUVEGARDE</div></div><div class="panel"><div class="eyebrow">LOCAL DATA</div><h2 style="font-size:34px;margin:8px 0 4px">Ta progression reste sur cet appareil.</h2><div class="tiny">Sauvegarde automatique après chaque réponse. Dernière écriture : ${last}.</div><div class="saveGrid"><div class="saveCard"><div class="missionTitle">Sauvegarde locale</div><div class="missionDesc">Force une sauvegarde immédiate dans le navigateur.</div><button class="secondaryBtn" onclick="manualSave()">SAUVEGARDER MAINTENANT</button></div><div class="saveCard"><div class="missionTitle">Exporter</div><div class="missionDesc">Télécharge un fichier JSON contenant XP, erreurs, tests, leçons et maîtrise.</div><button class="secondaryBtn" onclick="exportSave()">EXPORTER JSON</button></div><div class="saveCard"><div class="missionTitle">Importer</div><div class="missionDesc">Recharge une sauvegarde précédemment exportée.</div><input class="fileInput" id="importFile" type="file" accept="application/json" onchange="importSave(this.files[0])"><button class="secondaryBtn" onclick="document.getElementById('importFile').click()">IMPORTER JSON</button></div><div class="saveCard"><div class="missionTitle">Réinitialiser</div><div class="missionDesc">Efface toute la progression locale.</div><button class="secondaryBtn" onclick="resetAll()" style="color:#ff9aa3">TOUT EFFACER</button></div></div>${state.tests.length?`<div class="sectionHead"><div class="sectionTitle">Historique des tests</div><div class="sectionMeta">${state.tests.length} sauvegardés</div></div>${state.tests.slice(0,5).map(t=>`<div class="mistakeRow"><div class="mistakeQ">${new Date(t.date).toLocaleDateString('fr-FR')} · ${t.total} questions</div><div class="mistakeA">${t.pct}% · ${t.score}/${t.total}</div></div>`).join('')}`:''}</div>`}
function exportSave(){save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deutsch-quest-iphone-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=Object.assign({},DEFAULT_STATE,x);save();showToast('Sauvegarde importée');renderHome()}catch(e){alert('Fichier de sauvegarde invalide.')}};r.readAsText(file)}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&current&&!locked){if(current.type==='input')checkInput();else if(current.type==='order')checkOrder()}if(current?.type==='mcq'&&!locked&&['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('.option')[Number(e.key)-1];if(b)b.click()}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
renderHome();
</script></body></html>
