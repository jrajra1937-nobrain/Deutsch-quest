name: English Quest recorded pronunciation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/english-quest-audio.yml"
      - "english-quest/generate_audio.py"

permissions:
  contents: write

concurrency:
  group: english-quest-pronunciation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --quiet edge-tts
      - name: Generate all spoken examples and question audio
        run: python english-quest/generate_audio.py
      - name: Verify all audio files exist and publish them
        run: |
          test -f english-quest/audio-map.json
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("english-quest/audio-map.json").read_text())
          assert d["count"] == 304, d["count"]
          assert len(d["files"]) == 304
          assert all((pathlib.Path("english-quest") / v[2:]).stat().st_size > 1000 for v in d["files"].values())
          print("Verified", len(d["files"]), "recorded audio files")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-quest/audio english-quest/audio-map.json
          if git diff --cached --quiet; then
            echo "No new recordings to commit"
          else
            git commit -m "Add 304 prerecorded English Quest pronunciation clips"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
